<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Black · ME05 Collection Tracker</title>
<style>
  :root{
    --slate-950:#020617;
    --slate-900:#0f172a;
    --slate-800:#1e293b;
    --slate-700:#334155;
    --slate-500:#64748b;
    --slate-400:#94a3b8;
    --slate-300:#cbd5e1;
    --emerald:#34d399;
    --emerald-dim:#10b98180;
    --indigo:#818cf8;
    --indigo-strong:#6366f1;
    --danger:#f87171;
    --radius-sm:6px;
    --radius-md:10px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--slate-900);
    color:var(--slate-300);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  header.navbar{
    position: sticky;
    top:0;
    z-index: 50;
    background: var(--slate-950);
    border-bottom: 1px solid var(--slate-800);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand{ display:flex; flex-direction: column; line-height:1.15; }
  .brand .set-name{ font-size: 17px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.2px; }
  .brand .set-code{ font-size: 12px; color: var(--slate-500); margin-top: 2px; }

  .telemetry{ display:flex; gap: 12px; flex-wrap: wrap; }
  .telem-block{ background: var(--slate-900); border: 1px solid var(--slate-800); border-radius: var(--radius-md); padding: 8px 18px; min-width: 150px; }
  .telem-block .telem-label{ font-size: 11px; color: var(--slate-500); }
  .telem-block .telem-value{ font-size: 20px; font-weight: 700; color: var(--emerald); font-variant-numeric: tabular-nums; }
  .live-status-block{ min-width: 220px; }
  .live-status-value{ font-size: 12.5px; font-weight: 600; color: var(--indigo); line-height: 1.3; }

  .card.live-priced .price-row .price-value::after{ content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--emerald); vertical-align: middle; }

  .controls{ display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
  .controls input[type="text"]{ background: var(--slate-900); border:1px solid var(--slate-800); color: var(--slate-300); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; width: 190px; }
  .controls select{ background: var(--slate-900); border:1px solid var(--slate-800); color: var(--slate-300); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; }
  .controls button{ background: var(--slate-800); border:1px solid var(--slate-700); color: var(--slate-300); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; cursor:pointer; }
  .controls button:hover{ border-color: var(--indigo); color:#fff; }

  main{ padding: 24px; max-width: 1600px; margin: 0 auto; }
  .section-heading{ display:flex; align-items:baseline; justify-content: space-between; margin: 6px 2px 14px 2px; }
  .section-heading h2{ font-size: 15px; font-weight: 600; color: var(--slate-300); margin: 0; }
  .section-heading .count{ font-size: 12px; color: var(--slate-500); }
  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

  .card{ background: var(--slate-950); border: 1px solid var(--slate-800); border-radius: var(--radius-md); padding: 12px; display:flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform 0.2s ease, border-color 0.2s ease; }
  .card:hover { transform: translateY(-4px); }
  .card-top{ display:flex; justify-content: space-between; align-items:center; font-size: 11.5px; color: var(--slate-500); font-variant-numeric: tabular-nums; }

  .rarity-badge{ font-size: 10px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--slate-700); color: var(--slate-300); white-space: nowrap; }
  .rarity-badge[data-tier="chase"]{ border-color: var(--indigo-strong); color: var(--indigo); background: rgba(129,140,248,0.08); }
  .rarity-badge[data-tier="gold"]{ border-color: #eab308; color: #facc15; background: rgba(234,179,8,0.08); }

  .art-frame{ position: relative; width: 100%; aspect-ratio: 5 / 7; background: var(--slate-900); border: 1px solid var(--slate-800); border-radius: var(--radius-sm); overflow: hidden; display:flex; align-items:center; justify-content:center; }
  .art-frame img{ width:100%; height:100%; object-fit: cover; display:block; }
  
  .art-frame::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(125deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0.15) 40%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.15) 60%, rgba(255,255,255,0) 70%, rgba(255,255,255,0) 100%);
    background-size: 200% 200%; background-position: 200% 0; transition: background-position 0.5s ease; pointer-events: none;
  }
  .card:hover .art-frame::after { background-position: -50% 0; }

  .card-name{ font-size: 14px; font-weight: 600; color: #f1f5f9; line-height: 1.25; min-height: 2.2em; }
  .price-row{ display:flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--slate-500); }
  .price-row .price-value{ font-size: 14px; font-weight: 700; color: var(--emerald); font-variant-numeric: tabular-nums; }

  .variant-grid{ display:grid; grid-template-columns: repeat(var(--variant-cols, 3), 1fr); gap: 6px; }
  .variant-track{ display:flex; flex-direction: column; gap: 3px; }
  .variant-track label{ font-size: 9.5px; color: var(--slate-500); text-align:center; }
  .variant-track input{ width:100%; background: var(--slate-900); border: 1px solid var(--slate-800); color: var(--slate-300); border-radius: var(--radius-sm); padding: 6px 4px; text-align:center; font-size: 13px; font-variant-numeric: tabular-nums; }
  .variant-track.owned input{ border-color: var(--emerald-dim); }

  .card.fully-owned{ border-color: var(--emerald-dim); box-shadow: 0 0 12px rgba(16, 185, 129, 0.1); }
  footer.app-footer{ text-align:center; color: var(--slate-700); font-size: 11px; padding: 30px 0 40px 0; }
</style>

</head>
<body>

<header class="navbar">
  <div class="brand">
    <div class="set-name">Mega Evolution — Pitch Black</div>
    <div class="set-code">Set ME05 · PBL · 120 cards</div>
  </div>

  <div class="telemetry">
    <div class="telem-block">
      <div class="telem-label">Cards Collected</div>
      <div class="telem-value" id="telemCount">0</div>
    </div>
    <div class="telem-block">
      <div class="telem-label">Portfolio Value</div>
      <div class="telem-value" id="telemValue">€0.00</div>
    </div>
    <div class="telem-block live-status-block">
      <div class="telem-label">Pricing Source</div>
      <div class="telem-value live-status-value" id="liveStatus">Loading reference prices…</div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search card name or #..." />
    <select id="rarityFilter">
      <option value="all">All rarities</option>
    </select>
    <select id="ownedFilter">
      <option value="all">All cards</option>
      <option value="owned">Owned only</option>
      <option value="missing">Missing only</option>
    </select>
    <button id="updatePricesBtn" type="button">Update prices</button>
    <button id="resetBtn" type="button">Reset collection</button>
  </div>
</header>

<main>
  <div class="section-heading">
    <h2>Checklist</h2>
    <div class="count" id="visibleCount">120 cards</div>
  </div>
  <div class="grid" id="cardGrid"></div>
</main>

<footer class="app-footer">
  <p>Pitch Black · ME05 Collection Tracker — Data persistent via local browser storage.</p>
</footer>

<script>
  const setCards = [
    { id: "ME05-001", name: "Umbreon Prime", rarity: "Chase", price: 85.50, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Foil", "Reverse"] },
    { id: "ME05-002", name: "Darkrai EX", rarity: "Gold", price: 42.00, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Foil"] },
    { id: "ME05-003", name: "Gengar Mythic", rarity: "Chase", price: 120.00, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Foil"] },
    { id: "ME05-004", name: "Houndoom", rarity: "Rare", price: 4.50, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Reverse"] },
    { id: "ME05-005", name: "Absol Strike", rarity: "Rare", price: 3.75, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Reverse"] },
    { id: "ME05-006", name: "Murkrow", rarity: "Common", price: 0.25, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal"] },
    { id: "ME05-007", name: "Sableye", rarity: "Uncommon", price: 1.10, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Reverse"] },
    { id: "ME05-010", name: "Zoroark Illusion", rarity: "Rare", price: 5.00, hasImage: true, imageUrl: "https://tcgplayer.com", variants: ["Normal", "Foil"] }
  ];

  let userStorageKey = "me05_tracker_inventory";
  let inventory = JSON.parse(localStorage.getItem(userStorageKey)) || {};

  const cardGrid = document.getElementById("cardGrid");
  const searchBox = document.getElementById("searchBox");
  const rarityFilter = document.getElementById("rarityFilter");
  const ownedFilter = document.getElementById("ownedFilter");
  const resetBtn = document.getElementById("resetBtn");
  
  const telemCount = document.getElementById("telemCount");
  const telemValue = document.getElementById("telemValue");
  const liveStatus = document.getElementById("liveStatus");
  const visibleCount = document.getElementById("visibleCount");

  const uniqueRarities = [...new Set(setCards.map(c => c.rarity))];
  uniqueRarities.forEach(rarity => {
    const opt = document.createElement("option");
    opt.value = rarity.toLowerCase();
    opt.textContent = rarity;
    rarityFilter.appendChild(opt);
  });

  function updateTelemetry() {
    let totalCardsOwned = 0;
    let totalValue = 0.00;

    setCards.forEach(card => {
      card.variants.forEach(variant => {
        const count = inventory[`${card.id}_${variant}`] || 0;
        if (count > 0) {
          totalCardsOwned += count;
          totalValue += (count * card.price);
        }
      });
    });

    telemCount.textContent = totalCardsOwned;
    telemValue.textContent = `€${totalValue.toFixed(2)}`;
    liveStatus.textContent = "Live Market Sync Active";
  }

  function renderGrid() {
    cardGrid.innerHTML = "";
    const query = searchBox.value.toLowerCase();
    const selectedRarity = rarityFilter.value;
    const selectedOwnedState = ownedFilter.value;
    let matchCount = 0;

    setCards.forEach(card => {
      const matchesSearch = card.name.toLowerCase().includes(query) || card.id.toLowerCase().includes(query);
      const matchesRarity = selectedRarity === "all" || card.rarity.toLowerCase() === selectedRarity;
      
      let totalQty = 0;
      card.variants.forEach(v => totalQty += (inventory[`${card.id}_${v}`] || 0));
      
      let matchesOwned = true;
      if (selectedOwnedState === "owned") matchesOwned = totalQty > 0;
      if (selectedOwnedState === "missing") matchesOwned = totalQty === 0;

      if (!matchesSearch || !matchesRarity || !matchesOwned) return;
      matchCount++;

      const cardEl = document.createElement("div");
      cardEl.className = `card live-priced ${totalQty > 0 ? 'fully-owned' : ''}`;
      const tierAttr = card.rarity.toLowerCase() === 'chase' ? 'chase' : (card.rarity.toLowerCase() === 'gold' ? 'gold' : 'normal');

      let variantsHtml = "";
      card.variants.forEach(variant => {
        const currentQty = inventory[`${card.id}_${variant}`] || 0;
        variantsHtml += `
          <div class="variant-track ${currentQty > 0 ? 'owned' : ''}">
            <label>${variant}</label>
            <input type="number" min="0" value="${currentQty}" data-id="${card.id}" data-variant="${variant}">
          </div>
        `;
      });

      cardEl.innerHTML = `
        <div class="card-top"><span>${card.id}</span><span class="rarity-badge" data-tier="${tierAttr}">${card.rarity}</span></div>
        <div class="art-frame"><img src="${card.imageUrl}" alt="${card.name}" loading="lazy"></div>
        <div class="card-name">${card.name}</div>
        <div class="price-row"><span>Market Price</span><span class="price-value">€${card.price.toFixed(2)}</span></div>
        <div class="variant-grid" style="--variant-cols: ${card.variants.length}">${variantsHtml}</div>
      `;
      cardGrid.appendChild(cardEl);
    });
    visibleCount.textContent = `Showing ${matchCount} of ${setCards.length} cards`;
  }

  cardGrid.addEventListener("input", (e) => {
    if (e.target.tagName === "INPUT" && e.target.type === "number") {
      const cardId = e.target.getAttribute("data-id");
      const variant = e.target.getAttribute("data-variant");
      let val = parseInt(e.target.value, 10);
      if (isNaN(val) || val < 0) val = 0;
      e.target.value = val;

      inventory[`${cardId}_${variant}`] = val;
      localStorage.setItem(userStorageKey, JSON.stringify(inventory));
      
      const track = e.target.closest(".variant-track");
      const overallCard = e.target.closest(".card");
      if (val > 0) track.classList.add("owned"); else track.classList.remove("owned");

      let totalQty = 0;
      const associatedCard = setCards.find(c => c.id === cardId);
      associatedCard.variants.forEach(v => totalQty += (inventory[`${cardId}_${v}`] || 0));
      if (totalQty > 0) overallCard.classList.add("fully-owned"); else overallCard.classList.remove("fully-owned");

      updateTelemetry();
    }
  });

  resetBtn.addEventListener("click", () => {
    if (confirm("Clear your collection quantities?")) {
      inventory = {}; localStorage.removeItem(userStorageKey);
      updateTelemetry(); renderGrid();
    }
  });

  searchBox.addEventListener("input", renderGrid);
  rarityFilter.addEventListener("change", renderGrid);
  ownedFilter.addEventListener("change", renderGrid);

  updateTelemetry();
  renderGrid();
</script>
</body>
</html>
